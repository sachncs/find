[package]
name = "k256-bmi2"
version = "0.1.0"
edition = "2021"
description = "Portable 5×52 limb schoolbook secp256k1 field multiplication — correctness oracle for k256 arithmetic. Drop-in portable replacement; not a hot-path accelerator."
license = "MIT"

[dependencies]

[dev-dependencies]
# Used by the `mul_matches_k256_reference` test to verify byte-exact
# equivalence with the reference k256 FieldElement::mul.
k256 = { version = "0.13", features = ["arithmetic", "expose-field", "bits", "pkcs8"] }
proptest = "1"
criterion = "0.8"

[[bench]]
name = "field_mul"
harness = false